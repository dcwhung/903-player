<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>903 收藏</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <style>
            /* 版面：一欄；每節一張卡，入面係按闊度縮細嘅手機 / 闊橫版舞台。舞台入面嘅顏色跟 app（tokens.css）截圖取色 */
            :root {
                --move: 520ms;
                --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
                --trail: calc(var(--move) * 0.3);
                --bg: #eef1f5;
                --surface: #ffffff;
                --ink: #18202b;
                --note: #5d6775;
                --line: #d3d9e2;
                --accent: #3b6fb6;
                --on-accent: #ffffff;
                --font: -apple-system, 'PingFang HK', 'Noto Sans TC', sans-serif;
                /* app 入面嘅顏色（唔跟頁面主題轉） */
                --app-cream: #f5d294;
                --app-track: rgb(20 34 52 / 38%);
                --app-ink: #ffffff;
                --app-muted: rgb(255 255 255 / 62%);
                --app-row: rgb(14 24 38 / 42%);
                --app-line: rgb(255 255 255 / 22%);
                --app-gold: #d4ae5c;
                --app-danger: #c8463d;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    --bg: #10151c;
                    --surface: #1a212b;
                    --ink: #e8edf3;
                    --note: #9aa5b3;
                    --line: #2e3845;
                    --accent: #7fa8e6;
                    --on-accent: #0d1420;
                    color-scheme: dark;
                }
            }
            :root[data-theme='dark'] {
                --bg: #10151c;
                --surface: #1a212b;
                --ink: #e8edf3;
                --note: #9aa5b3;
                --line: #2e3845;
                --accent: #7fa8e6;
                --on-accent: #0d1420;
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding-block: 24px 48px;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font);
            }
            main {
                display: grid;
                gap: 20px;
                max-width: 960px;
                margin: 0 auto;
            }
            h1 {
                margin: 0;
                font-size: 22px;
                text-wrap: balance;
            }
            h2 {
                margin: 0;
                font-size: 17px;
            }
            p {
                margin: 0;
                color: var(--note);
                font-size: 14px;
                line-height: 1.6;
            }
            .panel {
                display: grid;
                gap: 12px;
                padding: 16px;
                border-radius: 16px;
                background: var(--surface);
                min-width: 0;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }
            .pick,
            .act {
                padding: 8px 14px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--surface);
                color: var(--ink);
                font: inherit;
                font-size: 14px;
                cursor: pointer;
            }
            .pick[aria-pressed='true'] {
                border-color: var(--accent);
                background: var(--accent);
                color: var(--on-accent);
            }
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            .stages {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                align-items: flex-start;
            }
            .viewport {
                position: relative;
                overflow: hidden;
                border-radius: 14px;
                box-shadow: 0 2px 12px rgb(0 0 0 / 18%);
                background: #000;
                max-width: 100%;
                flex: none;
            }
            .stage {
                position: absolute;
                top: 0;
                left: 0;
                transform-origin: 0 0;
                overflow: hidden;
                background: center / 100% 100% no-repeat;
                font-family: var(--font);
                color: var(--app-ink);
            }
            .abs {
                position: absolute;
            }
            /* 收藏掣 */
            .bm {
                position: absolute;
                display: grid;
                place-items: center;
                border: 0;
                border-radius: 999px;
                background: transparent;
                color: var(--bm-color, var(--app-gold));
                cursor: pointer;
                padding: 0;
            }
            .bm svg {
                width: 60%;
                height: 60%;
            }
            .bm[aria-pressed='true'] .off,
            .bm[aria-pressed='false'] .on {
                display: none;
            }
            .patch {
                position: absolute;
                pointer-events: none;
            }
            /* 主頁 tab 複製品 */
            .tabs {
                position: absolute;
                display: flex;
                gap: 6px;
                padding: 6px;
                border-radius: 999px;
                background: #3e5c7c;
            }
            .tab {
                position: relative;
                z-index: 1;
                flex: 1 1 0;
                min-width: 0;
                display: grid;
                place-items: center;
                border: 0;
                border-radius: 999px;
                background: transparent;
                color: var(--app-ink);
                font: 500 14px/1 var(--font);
                cursor: pointer;
                overflow: hidden;
                transition:
                    flex-grow var(--move) var(--ease),
                    opacity var(--move) var(--ease),
                    color 260ms var(--ease);
            }
            .tab[aria-pressed='true'] {
                color: #1c2330;
                font-weight: 700;
            }
            .tab.icon {
                flex: 0 0 var(--icon-tab, 64px);
            }
            .tab.icon svg {
                width: 22px;
                height: 22px;
            }
            .tab.icon.gone {
                flex-basis: 0;
                opacity: 0;
                margin-left: -6px;
                pointer-events: none;
            }
            .tab.icon {
                transition:
                    flex-basis var(--move) var(--ease),
                    margin var(--move) var(--ease),
                    opacity var(--move) var(--ease),
                    color 260ms var(--ease);
            }
            .pill {
                position: absolute;
                top: 6px;
                bottom: 6px;
                border-radius: 999px;
                background: var(--app-cream);
                transition:
                    left var(--move) var(--ease),
                    right var(--move) var(--ease);
            }
            /* 收藏清單 */
            .list {
                position: absolute;
                overflow-y: auto;
                display: grid;
                align-content: start;
                grid-auto-rows: max-content;
                gap: 8px;
                padding-bottom: 16px;
            }
            .group {
                margin: 6px 4px 0;
                font: 600 13px/1.4 var(--font);
                color: var(--app-muted);
                letter-spacing: 0.04em;
            }
            .item {
                position: relative;
                border-radius: 14px;
                overflow: hidden;
                background: transparent;
                touch-action: pan-y;
            }
            .item .del {
                position: absolute;
                inset: 2px;
                display: grid;
                place-items: center end;
                padding-right: 16px;
                border-radius: 12px;
                background: var(--app-danger);
                font: 600 14px var(--font);
                color: #fff;
            }
            .card {
                position: relative;
                display: grid;
                grid-template-columns: 76px 1fr;
                gap: 12px;
                align-items: center;
                padding: 10px 12px;
                background: #2d4560;
                cursor: grab;
                user-select: none;
            }
            .thumb {
                width: 76px;
                aspect-ratio: 16 / 9;
                border-radius: 8px;
                background: center / cover no-repeat;
            }
            .card b {
                display: block;
                font: 700 15px/1.3 var(--font);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .card small {
                display: block;
                margin-top: 2px;
                font: 13px/1.3 var(--font);
                color: var(--app-muted);
            }
            .bar {
                height: 3px;
                margin-top: 8px;
                border-radius: 2px;
                background: var(--app-line);
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                background: var(--app-cream);
            }
            .state {
                margin-top: 4px;
                font: 12px/1.3 var(--font);
                color: var(--app-muted);
            }
            .collapse {
                transition:
                    height 260ms var(--ease),
                    opacity 260ms var(--ease),
                    margin 260ms var(--ease);
            }
            .opt-desc {
                min-height: 3.2em;
            }
            @media (prefers-reduced-motion: reduce) {
                .tab,
                .tab.icon,
                .pill,
                .collapse {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header style="display: grid; gap: 6px">
                <h1>P7 #7 成集收藏 + 我的收藏</h1>
                <p>
                    v1.26.1 真截圖加上收藏掣同收藏 tab。收藏單位係「一集」（節目某日 /
                    廣播劇一集）。撳收藏掣會即刻 ☆ ↔ ★ 切換。
                </p>
            </header>

            <section class="panel">
                <h2>① 收藏 icon</h2>
                <div class="row" data-group="icon">
                    <button type="button" class="pick" data-val="star" aria-pressed="true">
                        I1 星星
                    </button>
                    <button type="button" class="pick" data-val="ribbon" aria-pressed="false">
                        I2 書籤
                    </button>
                    <button type="button" class="pick" data-val="heart" aria-pressed="false">
                        I3 心心
                    </button>
                </div>
                <p>下面所有畫面都會跟住換 icon。</p>
            </section>

            <section class="panel">
                <h2>② 播放器入面收藏掣放邊</h2>
                <div class="row" data-group="place">
                    <button type="button" class="pick" data-val="p1" aria-pressed="true">
                        P1 頁頭右上角
                    </button>
                    <button type="button" class="pick" data-val="p2" aria-pressed="false">
                        P2 播放掣右邊
                    </button>
                    <button type="button" class="pick" data-val="p3" aria-pressed="false">
                        P3「現正播放」旁邊
                    </button>
                </div>
                <p class="opt-desc" id="place-desc"></p>
                <div class="stages">
                    <div class="viewport" id="v-show"></div>
                    <div class="viewport" id="v-card"></div>
                </div>
                <p>
                    左：手機節目頁（集數清單每行都加一粒，喺 ▶ 左邊）。右：闊橫版主頁右邊卡（P1 =
                    卡頁頭 ⤢ 左邊）。
                </p>
            </section>

            <section class="panel">
                <h2>③ 主頁「收藏」tab + 清單</h2>
                <p>
                    第三個 tab 窄啲、淨係
                    icon，有收藏先出現。撳佢睇收藏清單；喺清單左滑一行移除，移除晒最後一集 tab
                    會淡走、跳返「節目」。
                </p>
                <div class="row" data-group="sort">
                    <button type="button" class="pick" data-val="l1" aria-pressed="true">
                        L1 一個清單（新收藏行頭）
                    </button>
                    <button type="button" class="pick" data-val="l2" aria-pressed="false">
                        L2 分「節目 / 廣播劇」
                    </button>
                    <button type="button" class="pick" data-val="l3" aria-pressed="false">
                        L3 按節目 / 劇分組
                    </button>
                </div>
                <div class="row">
                    <button type="button" class="act" id="reset">重新加返 6 集收藏</button>
                    <button type="button" class="act" id="clear">清晒收藏（tab 消失）</button>
                </div>
                <div class="stages">
                    <div class="viewport" id="v-home"></div>
                </div>
            </section>
        </main>

        <script>
            const IMG = {
                nHome: 'n-home.webp',
                nShow: 'n-show.webp',
                wHome: 'w-home.webp',
                gongzi: 'thumb-gongzi.webp',
                badgirl: 'thumb-badgirl.webp',
                wanni: 'thumb-wanni.webp',
                lancy: 'thumb-lancy.webp',
                chisee: 'thumb-chisee.webp',
            };
            const ICONS = {
                star: {
                    off: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                    on: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                },
                ribbon: {
                    off: '<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                    on: '<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                },
                heart: {
                    off: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                    on: '<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
                },
            };
            const PLACE_DESC = {
                p1: '頁頭右上角，同左上角「返回」對稱。唔會擠到播放掣，但同播放器有啲距離。',
                p2: '控制列：播放掣右邊，同左邊「由頭播放」對稱。最就手，聽緊覺得好就撳。',
                p3: '「現正播放」字旁邊，即係講明係收藏而家呢集。比較細粒，唔搶眼。',
            };
            /** 節目頁（390×844）同闊橫版卡（1300×800）入面三個位，用 v1.26.1 量到嘅 element 位置 */
            const PLACES = {
                show: {
                    p1: { x: 334, y: 16, s: 44, color: '#d4ae5c' },
                    p2: { x: 223, y: 362, s: 44, color: '#d4ae5c' },
                    p3: { x: 232, y: 428, s: 24, color: '#d4ae5c' },
                },
                card: {
                    p1: { x: 1124, y: 76, s: 40, color: '#7cc4ec' },
                    p2: { x: 1098, y: 375, s: 40, color: '#7cc4ec' },
                    p3: { x: 1158, y: 447, s: 28, color: '#7cc4ec' },
                },
            };
            /** 節目頁集數清單：每行 ▶ 左邊加一粒（遮住進度線尾段） */
            const SHOW_ROWS = [
                { y: 539, bg: '#1c1a15' },
                { y: 595, bg: '#111111' },
                { y: 651, bg: '#111111' },
                { y: 707, bg: '#111111' },
            ];
            const ROW_H = 56;
            const ROW_BM = { x: 292, s: 40 };
            const PATCH_X = 284;
            const PATCH_W = 44;
            const PHONE = { w: 390, h: 844, max: 0.82 };
            const WIDE = { w: 1300, h: 800, max: 0.62 };
            const TABS = { x: 16, y: 133, w: 358, h: 50 };
            const LIST = { x: 16, y: 195, w: 358, h: 548 };
            const SWIPE_REMOVE = 0.4;

            const state = { icon: 'star', place: 'p1', sort: 'l1', tab: 'shows' };

            const SAMPLE = [
                {
                    id: 1,
                    kind: 'show',
                    who: 'gongzi',
                    name: '公子會',
                    label: '17/10（六）',
                    ratio: 0.01,
                    text: '聽到 0:02 / 10:00',
                    added: 6,
                },
                {
                    id: 2,
                    kind: 'drama',
                    who: 'chisee',
                    name: '芝See菇Bi Family',
                    label: '三十六計 · 第 3 集',
                    ratio: 1,
                    text: '已聽完',
                    added: 5,
                },
                {
                    id: 3,
                    kind: 'show',
                    who: 'badgirl',
                    name: 'Bad Girl大過佬',
                    label: '15/10（四）',
                    ratio: 0.27,
                    text: '聽到 32:10 / 2:00:00',
                    added: 4,
                },
                {
                    id: 4,
                    kind: 'show',
                    who: 'gongzi',
                    name: '公子會',
                    label: '03/10（六）',
                    ratio: 0,
                    text: '未收聽',
                    added: 3,
                },
                {
                    id: 5,
                    kind: 'drama',
                    who: 'lancy',
                    name: '蘭茜夫人劇場',
                    label: '戀愛二分一 · 第 1 集',
                    ratio: 1,
                    text: '已聽完',
                    added: 2,
                },
                {
                    id: 6,
                    kind: 'show',
                    who: 'wanni',
                    name: '雲妮鍾情',
                    label: '14/10（三）',
                    ratio: 0,
                    text: '未收聽',
                    added: 1,
                },
            ];
            let items = SAMPLE.map((x) => ({ ...x }));

            const svg = (name, on) =>
                `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name][on ? 'on' : 'off']}</svg>`;
            const bmButton = (x, y, s, color, pressed = false) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'bm';
                Object.assign(b.style, {
                    left: `${x}px`,
                    top: `${y}px`,
                    width: `${s}px`,
                    height: `${s}px`,
                });
                b.style.setProperty('--bm-color', color);
                b.setAttribute('aria-pressed', String(pressed));
                b.setAttribute('aria-label', '收藏呢集');
                paintBm(b);
                b.addEventListener('click', () => {
                    b.setAttribute(
                        'aria-pressed',
                        String(b.getAttribute('aria-pressed') !== 'true'),
                    );
                    paintBm(b);
                });
                return b;
            };
            const paintBm = (b) => {
                b.innerHTML = `<span class="off">${svg(state.icon, false)}</span><span class="on">${svg(state.icon, true)}</span>`;
                b.querySelectorAll('span').forEach((s) =>
                    Object.assign(s.style, {
                        display: '',
                        width: '100%',
                        height: '100%',
                        placeItems: 'center',
                    }),
                );
                b.querySelectorAll('span').forEach(
                    (s) =>
                        (s.style.display = s.classList.contains(
                            b.getAttribute('aria-pressed') === 'true' ? 'on' : 'off',
                        )
                            ? 'grid'
                            : 'none'),
                );
            };

            const makeStage = (id, size, img) => {
                const view = document.getElementById(id);
                view.innerHTML = '';
                const stage = document.createElement('div');
                stage.className = 'stage';
                stage.style.width = `${size.w}px`;
                stage.style.height = `${size.h}px`;
                stage.style.backgroundImage = `url(${IMG[img]})`;
                view.append(stage);
                const fit = () => {
                    const avail = view.parentElement.clientWidth;
                    const scale = Math.min(size.max, avail / size.w);
                    stage.style.transform = `scale(${scale})`;
                    view.style.width = `${size.w * scale}px`;
                    view.style.height = `${size.h * scale}px`;
                };
                fit();
                addEventListener('resize', fit);
                return stage;
            };

            const renderShow = () => {
                const stage = makeStage('v-show', PHONE, 'nShow');
                SHOW_ROWS.forEach((r, i) => {
                    const patch = document.createElement('div');
                    patch.className = 'patch';
                    Object.assign(patch.style, {
                        left: `${PATCH_X}px`,
                        top: `${r.y + 8}px`,
                        width: `${PATCH_W}px`,
                        height: `${ROW_H - 16}px`,
                        background: r.bg,
                    });
                    stage.append(
                        patch,
                        bmButton(
                            ROW_BM.x,
                            r.y + (ROW_H - ROW_BM.s) / 2,
                            ROW_BM.s,
                            '#d4ae5c',
                            i === 0,
                        ),
                    );
                });
                const p = PLACES.show[state.place];
                stage.append(bmButton(p.x, p.y, p.s, p.color, true));
            };
            const renderCard = () => {
                const stage = makeStage('v-card', WIDE, 'wHome');
                const p = PLACES.card[state.place];
                stage.append(bmButton(p.x, p.y, p.s, p.color));
            };

            /* ── ③ 主頁 tab + 清單 ── */
            let home;
            const renderHome = () => {
                const stage = makeStage('v-home', PHONE, 'nHome');
                const cover = document.createElement('div');
                cover.className = 'abs';
                Object.assign(cover.style, {
                    left: 0,
                    top: `${LIST.y - 8}px`,
                    width: '390px',
                    height: `${LIST.h + 16}px`,
                    background: 'linear-gradient(#4b7096, #3f6087)',
                    display: 'none',
                });
                const list = document.createElement('div');
                list.className = 'list';
                Object.assign(list.style, {
                    left: `${LIST.x}px`,
                    top: `${LIST.y}px`,
                    width: `${LIST.w}px`,
                    height: `${LIST.h}px`,
                    display: 'none',
                });
                const tabs = document.createElement('div');
                tabs.className = 'tabs';
                Object.assign(tabs.style, {
                    left: `${TABS.x}px`,
                    top: `${TABS.y}px`,
                    width: `${TABS.w}px`,
                    height: `${TABS.h}px`,
                });
                const pill = document.createElement('div');
                pill.className = 'pill';
                const mk = (key, html, extra = '') => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = `tab ${extra}`;
                    b.dataset.tab = key;
                    b.innerHTML = html;
                    b.addEventListener('click', () => selectTab(key));
                    return b;
                };
                const tShows = mk('shows', '節目');
                const tDramas = mk('dramas', '廣播劇');
                const tSaved = mk('saved', svg(state.icon, true), 'icon');
                tSaved.setAttribute('aria-label', '我的收藏');
                tabs.append(pill, tShows, tDramas, tSaved);
                stage.append(cover, list, tabs);
                home = { stage, cover, list, tabs, pill, tSaved, tShows, tDramas };
                syncTabs(false);
                renderList();
            };

            const placePill = () => {
                const t = home.tabs.querySelector(`[data-tab="${state.tab}"]`);
                const left = t.offsetLeft;
                const right = home.tabs.clientWidth - left - t.offsetWidth;
                home.pill.style.left = `${left}px`;
                home.pill.style.right = `${right}px`;
            };
            const syncTabs = (animate = true) => {
                home.tSaved.classList.toggle('gone', items.length === 0);
                home.tabs
                    .querySelectorAll('.tab')
                    .forEach((t) =>
                        t.setAttribute('aria-pressed', String(t.dataset.tab === state.tab)),
                    );
                const showList = state.tab === 'saved';
                home.cover.style.display = showList ? 'block' : 'none';
                home.list.style.display = showList ? 'grid' : 'none';
                if (!animate) home.pill.style.transition = 'none';
                placePill();
                // tab 闊度郁緊：每格跟住更新膠囊位置
                const until = performance.now() + 560;
                const follow = () => {
                    placePill();
                    if (performance.now() < until) requestAnimationFrame(follow);
                };
                requestAnimationFrame(follow);
                if (!animate) requestAnimationFrame(() => (home.pill.style.transition = ''));
            };
            const selectTab = (key) => {
                if (key === 'saved' && items.length === 0) return;
                state.tab = key;
                syncTabs();
            };

            const groupsOf = () => {
                const byNew = [...items].sort((a, b) => b.added - a.added);
                if (state.sort === 'l1') return [{ title: null, rows: byNew }];
                if (state.sort === 'l2')
                    return [
                        { title: '節目', rows: byNew.filter((x) => x.kind === 'show') },
                        { title: '廣播劇', rows: byNew.filter((x) => x.kind === 'drama') },
                    ].filter((g) => g.rows.length);
                const names = [...new Set(byNew.map((x) => x.name))];
                return names.map((n) => ({
                    title: n,
                    rows: byNew.filter((x) => x.name === n),
                    compact: true,
                }));
            };

            const renderList = () => {
                home.list.innerHTML = '';
                groupsOf().forEach((g) => {
                    if (g.title) {
                        const h = document.createElement('div');
                        h.className = 'group';
                        h.textContent = g.title;
                        home.list.append(h);
                    }
                    g.rows.forEach((it) => home.list.append(rowOf(it, g.compact)));
                });
            };

            const rowOf = (it, compact) => {
                const wrap = document.createElement('div');
                wrap.className = 'item collapse';
                wrap.innerHTML = `<span class="del">移除</span>
                    <div class="card">
                        <div class="thumb" style="background-image:url(${IMG[it.who]})"></div>
                        <div style="min-width:0">
                            <b>${compact ? it.label : it.name}</b>
                            ${compact ? '' : `<small>${it.label}</small>`}
                            <div class="bar"><i style="width:${Math.round(it.ratio * 100)}%"></i></div>
                            <div class="state">${it.text}</div>
                        </div>
                    </div>`;
                swipe(wrap, it);
                return wrap;
            };

            /** 左滑：拖過一定比例就移除（同 mini player 一樣），唔夠就彈返 */
            const swipe = (wrap, it) => {
                const card = wrap.querySelector('.card');
                let startX = null;
                let dx = 0;
                let moved = false;
                card.addEventListener('pointerdown', (e) => {
                    startX = e.clientX;
                    card.setPointerCapture(e.pointerId);
                    card.style.transition = 'none';
                    moved = false;
                });
                card.addEventListener('pointermove', (e) => {
                    if (startX === null) return;
                    const scale = home.stage.getBoundingClientRect().width / PHONE.w;
                    dx = Math.min(0, (e.clientX - startX) / scale);
                    if (Math.abs(dx) > 4) moved = true;
                    card.style.transform = `translateX(${dx}px)`;
                });
                const end = () => {
                    if (startX === null) return;
                    startX = null;
                    card.style.transition = 'transform 260ms var(--ease)';
                    if (-dx > card.offsetWidth * SWIPE_REMOVE) {
                        card.style.transform = 'translateX(-110%)';
                        setTimeout(() => remove(wrap, it), 260);
                    } else {
                        card.style.transform = '';
                    }
                    dx = 0;
                };
                card.addEventListener('pointerup', end);
                card.addEventListener('pointercancel', end);
                card.addEventListener('click', () => {
                    if (!moved) flash(`入「${it.name}」頁，跳去 ${it.label}（唔會自動播）`);
                });
            };

            const remove = (wrap, it) => {
                wrap.style.height = `${wrap.offsetHeight}px`;
                requestAnimationFrame(() => {
                    wrap.style.height = '0px';
                    wrap.style.opacity = '0';
                    wrap.style.marginTop = '-8px';
                });
                setTimeout(() => {
                    items = items.filter((x) => x.id !== it.id);
                    if (items.length === 0) state.tab = 'shows';
                    renderList();
                    syncTabs();
                }, 280);
            };

            let toast;
            const flash = (text) => {
                toast?.remove();
                toast = document.createElement('div');
                toast.className = 'abs';
                Object.assign(toast.style, {
                    left: '24px',
                    right: '24px',
                    bottom: '120px',
                    padding: '12px 14px',
                    borderRadius: '12px',
                    background: 'rgb(10 16 24 / 88%)',
                    font: '14px/1.4 var(--font)',
                    textAlign: 'center',
                });
                toast.textContent = text;
                home.stage.append(toast);
                setTimeout(() => toast?.remove(), 1800);
            };

            const renderAll = () => {
                renderShow();
                renderCard();
                renderHome();
            };

            document.querySelectorAll('[data-group]').forEach((group) =>
                group.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    group
                        .querySelectorAll('button')
                        .forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
                    state[group.dataset.group] = btn.dataset.val;
                    if (group.dataset.group === 'place')
                        document.getElementById('place-desc').textContent = PLACE_DESC[state.place];
                    if (group.dataset.group === 'sort') {
                        renderList();
                        if (items.length) selectTab('saved');
                    } else renderAll();
                }),
            );
            document.getElementById('reset').addEventListener('click', () => {
                items = SAMPLE.map((x) => ({ ...x }));
                renderList();
                syncTabs();
            });
            document.getElementById('clear').addEventListener('click', () => {
                items = [];
                state.tab = 'shows';
                renderList();
                syncTabs();
            });

            document.getElementById('place-desc').textContent = PLACE_DESC[state.place];
            renderAll();
            state.tab = 'saved';
            syncTabs(false);
        </script>
    </body>
</html>
