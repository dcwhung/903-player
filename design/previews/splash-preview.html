<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>載入畫面 Preview</title>
        <!--
            每個框用真實裝置尺寸載入 splash.html，再縮細顯示，
            所以見到嘅裁切、loading bar 位置同真機一樣
        -->
        <style>
            :root {
                color-scheme: dark;
                --page: #0d0d0f;
                --page-text: #ececf0;
                --page-muted: #a4a4ad;
                --page-line: #2a2a30;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--page);
                color: var(--page-text);
                font-family: system-ui, sans-serif;
                padding: 28px max(16px, env(safe-area-inset-left, 0px)) 40px;
            }
            .wrap {
                max-width: 1240px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 28px;
            }
            h1 {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
            }
            .intro {
                margin: 8px 0 0;
                color: var(--page-muted);
                font-size: 14px;
                line-height: 1.65;
                max-width: 760px;
            }
            .stage {
                display: flex;
                flex-wrap: wrap;
                gap: 28px;
                align-items: flex-start;
            }
            figure {
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            figcaption {
                color: var(--page-muted);
                font-size: 13px;
            }
            /* --w / --h：裝置 CSS px；--scale：顯示縮放 */
            .device {
                width: calc(var(--w) * var(--scale) * 1px);
                height: calc(var(--h) * var(--scale) * 1px);
                border-radius: 18px;
                border: 1px solid var(--page-line);
                overflow: hidden;
                position: relative;
            }
            .device iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: calc(var(--w) * 1px);
                height: calc(var(--h) * 1px);
                border: 0;
                transform: scale(var(--scale));
                transform-origin: 0 0;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>載入畫面（Splash）Preview</h1>
                <p class="intro">
                    JS 未跑完之前顯示，直接寫入 index.html，唔使等 Google Fonts。按畫面闊高比揀底圖：直身手機、iPad、桌面（橫身手機都用桌面圖）。黃色
                    loading bar 釘喺 logo 下面，版本號貼住底部。
                </p>
            </header>
            <div class="stage">
                <figure>
                    <div class="device" style="--w: 390; --h: 844; --scale: 0.6">
                        <iframe src="splash.html" title="iPhone 直身"></iframe>
                    </div>
                    <figcaption>iPhone 直身 390 × 844（手機圖）</figcaption>
                </figure>
                <figure>
                    <div class="device" style="--w: 820; --h: 1180; --scale: 0.43">
                        <iframe src="splash.html" title="iPad 直身"></iframe>
                    </div>
                    <figcaption>iPad 直身 820 × 1180（iPad 圖）</figcaption>
                </figure>
                <figure>
                    <div class="device" style="--w: 1180; --h: 820; --scale: 0.43">
                        <iframe src="splash.html" title="iPad 橫身"></iframe>
                    </div>
                    <figcaption>iPad 橫身 1180 × 820（iPad 圖）</figcaption>
                </figure>
                <figure>
                    <div class="device" style="--w: 1440; --h: 900; --scale: 0.5">
                        <iframe src="splash.html" title="桌面"></iframe>
                    </div>
                    <figcaption>桌面 1440 × 900（桌面圖）</figcaption>
                </figure>
                <figure>
                    <div class="device" style="--w: 844; --h: 390; --scale: 0.6">
                        <iframe src="splash.html" title="iPhone 橫身"></iframe>
                    </div>
                    <figcaption>iPhone 橫身 844 × 390（桌面圖）</figcaption>
                </figure>
            </div>
        </div>
    </body>
</html>
