<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>903 Player 載入畫面</title>
        <!--
            啟動畫面：之後會原封不動搬入 index.html（inline，唔使等 JS / Google Fonts）。
            底圖係 cover：用一個同底圖一樣比例、蓋滿 viewport 嘅框（.splash-art），
            loading bar 用百分比釘喺框入面，所以無論點裁，都會貼住 logo 下面。
            按 viewport 闊高比揀圖：直身手機 / iPad / 桌面（橫身手機都用桌面圖）。
        -->
        <style>
            :root {
                /* 底圖頂部嘅藍：圖未載完都唔會見到黑屏 */
                --splash-bg: #5bade5;
                /* 黃色取自 logo 兩邊嘅閃光 */
                --splash-yellow: #f8e076;
                --splash-yellow-light: #fcefb4;
                --splash-yellow-dark: #e9c94f;
                --splash-track: rgb(255 255 255 / 0.38);
                --splash-text: #ffffff;
                --splash-text-shadow: 0 1px 2px rgb(30 90 150 / 0.45);
                --splash-bar-height: 10px;
                --splash-gap: 14px;
                --splash-font-size: 15px;
                --splash-slide-duration: 1.4s;
                /* 版本號喺底部淺色雲上面：用深藍先睇得清 */
                --splash-version-text: #255d91;
                --splash-version-font-size: 12px;
                --splash-version-bottom: 16px;

                /* 直身手機（923 × 2000）：logo 底約 53.5%，雲由約 72% 開始 */
                --splash-image: url('../splash-mobile.webp');
                --splash-ratio: 923 / 2000;
                --splash-ratio-value: 0.4615;
                --splash-bar-top: 59%;
                --splash-bar-width: 38%;
            }
            /* iPad（2000 × 1499）：闊高比 0.65 – 1.5，包括 iPad 直身同橫身 */
            @media (min-aspect-ratio: 13 / 20) {
                :root {
                    --splash-image: url('../splash-tablet.webp');
                    --splash-ratio: 2000 / 1499;
                    --splash-ratio-value: 1.3342;
                    --splash-bar-top: 62.5%;
                    --splash-bar-width: 20%;
                }
            }
            /* 桌面 / 橫身手機（2000 × 1125） */
            @media (min-aspect-ratio: 3 / 2) {
                :root {
                    --splash-image: url('../splash-desktop.webp');
                    --splash-ratio: 2000 / 1125;
                    --splash-ratio-value: 1.7778;
                    --splash-bar-top: 61%;
                    --splash-bar-width: 16%;
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--splash-bg);
            }
            .splash {
                position: fixed;
                inset: 0;
                overflow: hidden;
                background: var(--splash-bg);
            }
            /* 同底圖一樣比例、蓋滿 viewport：闊度 = max(100vw, 100vh × 比例) */
            .splash-art {
                position: absolute;
                left: 50%;
                top: 50%;
                width: max(100vw, 100dvh * var(--splash-ratio-value));
                aspect-ratio: var(--splash-ratio);
                transform: translate(-50%, -50%);
                background: var(--splash-image) center / 100% 100% no-repeat;
            }
            .splash-status {
                position: absolute;
                left: 50%;
                top: var(--splash-bar-top);
                width: var(--splash-bar-width);
                min-width: 140px;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: var(--splash-gap);
            }
            .splash-bar {
                position: relative;
                width: 100%;
                height: var(--splash-bar-height);
                border-radius: 999px;
                overflow: hidden;
                background: var(--splash-track);
                box-shadow: inset 0 1px 2px rgb(30 90 150 / 0.25);
            }
            /* 未知進度：一段黃色喺軌道入面來回滑 */
            .splash-bar::after {
                content: '';
                position: absolute;
                inset: 0 auto 0 0;
                width: 40%;
                border-radius: inherit;
                background: linear-gradient(
                    180deg,
                    var(--splash-yellow-light) 0%,
                    var(--splash-yellow) 45%,
                    var(--splash-yellow-dark) 100%
                );
                box-shadow: 0 1px 3px rgb(160 120 20 / 0.35);
                animation: splash-slide var(--splash-slide-duration) ease-in-out infinite;
            }
            @keyframes splash-slide {
                from {
                    transform: translateX(-100%);
                }
                to {
                    transform: translateX(250%);
                }
            }
            .splash-text {
                margin: 0;
                color: var(--splash-text);
                font:
                    500 var(--splash-font-size) / 1.4 system-ui,
                    -apple-system,
                    'PingFang HK',
                    'Microsoft JhengHei',
                    sans-serif;
                letter-spacing: 0.08em;
                text-shadow: var(--splash-text-shadow);
            }
            /* 版本號：貼住 viewport 底（唔跟底圖），避開 iPhone home indicator */
            .splash-version {
                position: absolute;
                left: 0;
                right: 0;
                bottom: calc(var(--splash-version-bottom) + env(safe-area-inset-bottom, 0px));
                margin: 0;
                text-align: center;
                color: var(--splash-version-text);
                font:
                    500 var(--splash-version-font-size) / 1.4 system-ui,
                    -apple-system,
                    sans-serif;
                letter-spacing: 0.04em;
            }
            /* 減少動態：唔滑，改為成條黃色慢慢閃 */
            @media (prefers-reduced-motion: reduce) {
                .splash-bar::after {
                    width: 100%;
                    animation: splash-pulse 2s ease-in-out infinite alternate;
                }
                @keyframes splash-pulse {
                    from {
                        opacity: 0.45;
                    }
                    to {
                        opacity: 1;
                    }
                }
            }
        </style>
    </head>
    <body>
        <div class="splash" role="status" aria-live="polite">
            <div class="splash-art">
                <div class="splash-status">
                    <div class="splash-bar"></div>
                    <p class="splash-text">載入中…</p>
                </div>
            </div>
            <!-- 正式版由 build 注入 package.json 嘅版本（同主頁橫額 AppVersion 一樣格式） -->
            <p class="splash-version">v1.1.0</p>
        </div>
    </body>
</html>
