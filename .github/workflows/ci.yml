name: CI

# main 以外嘅 push：lint + type check + unit + build，之後 e2e。main 嘅部署照舊由 deploy.yml（player）同 deploy-api.yml（Worker）負責。
# 只用 push trigger：check run 掛喺 commit 上面，PR 頁照樣見到；同時用 pull_request 會令同一個 SHA 跑兩次。
# 今次 push 淨係改 docs → check / e2e 兩個 job 被 `if` 跳過。GitHub 當跳過嘅 job 係 Success，
# 所以 branch protection 嘅 required check 唔會卡住（workflow 層 paths-ignore 會令佢永遠 pending）。
on:
    push:
        branches-ignore: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect code changes
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # 比較今次 push 之前同之後；新 branch / force push 搵唔到 before 就用同 main 嘅 merge-base。
            # 判斷唔到（冇 base、diff 係空）一律當有 code 改動，照跑全套。
            - id: diff
              env:
                  BEFORE: ${{ github.event.before }}
                  DOCS_ONLY_PATTERN: '^(\.proj-docs/|\.tickets/|\.claude/|docs/|LICENSE)|\.md$'
              run: |
                  base="$BEFORE"
                  if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                      base="$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)"
                  fi
                  code=true
                  if [[ -n "$base" ]]; then
                      changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
                      if [[ -n "$changed" ]] && ! grep -qvE "$DOCS_ONLY_PATTERN" <<<"$changed"; then
                          code=false
                      fi
                  fi
                  echo "base=${base:-none} code=$code"
                  echo "code=$code" >> "$GITHUB_OUTPUT"

    check:
        name: Lint, unit & build
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            # 全部 workspace（player、admin、catalog、api）嘅 type check；build 只會 check player
            - run: npx tsc -b

            # 包括 apps/admin（jsdom）同 apps/api（Worker test 喺 miniflare / workerd 跑，唔使 Cloudflare 帳戶）
            - run: npm test

            # Production build（CI 冇 VITE_CATALOG_URL = runtime catalog flag off，同未設 repo variable 嘅 deploy 一樣）
            - run: npm run build

            # S-766：e2e job 用呢份 dist 做 production smoke（e2e 自己會 build 一份 e2e mode 覆蓋）
            - name: Upload production build
              uses: actions/upload-artifact@v5
              with:
                  name: player-dist-production
                  path: apps/player/dist
                  if-no-files-found: error
                  retention-days: 1

            # Admin SPA（Worker static assets 出）
            - run: npm run build:admin

    e2e:
        name: E2E (Playwright)
        needs: check
        # S-820：ubuntu-latest（26.04）解析唔到 archive.ubuntu.com，`playwright install --with-deps` 裝唔到系統套件；固定 24.04
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # npx 用 node_modules 鎖住嘅 Playwright（workspaces hoist 喺 repo 根），所以裝到嘅 Chromium revision 一定夾
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            # S-766：e2e build 預設設咗 catalog URL（行「flag 開 + 404 → fallback」），呢步補 production 真正 flag off 路徑：
            # check job 嗰份 production dist → sw.js 冇 catalog route → vite preview 開一次：splash 移走、版本號出到、
            # 0 個 catalog.json request、0 pageerror。用 4174 避開 e2e 嘅 4173
            - name: Download production build
              uses: actions/download-artifact@v5
              with:
                  name: player-dist-production
                  path: apps/player/dist

            - name: Production smoke (catalog flag off)
              working-directory: apps/player
              env:
                  SMOKE_PORT: '4174'
              run: |
                  set -euo pipefail
                  # 1) flag off：sw.js 冇 catalog runtime route（cache 名 catalog-json，見 scripts/catalogCaching.ts）
                  if grep -qF 'catalog-json' dist/sw.js; then
                      echo "::error::production sw.js has a catalog.json route (VITE_CATALOG_URL leaked into the build?)"
                      exit 1
                  fi
                  # 2) 起 vite preview（production mode）喺 Chromium 開一次
                  npx vite preview --port "$SMOKE_PORT" --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
                  # npx 會再開 child process（真正 listen 嘅 vite），按指令收
                  trap 'pkill -f "vite preview --port $SMOKE_PORT" || true' EXIT
                  for _ in $(seq 1 30); do
                      curl -sf "http://localhost:$SMOKE_PORT/903-player/" > /dev/null && break
                      sleep 1
                  done
                  node --input-type=module <<'EOF'
                  import { readFileSync } from 'node:fs';
                  import { chromium } from 'playwright';

                  const SPLASH_TIMEOUT_MS = 10_000;
                  const url = `http://localhost:${process.env.SMOKE_PORT}/903-player/`;
                  const version = `v${JSON.parse(readFileSync('package.json', 'utf8')).version}`;
                  const browser = await chromium.launch({ executablePath: process.env.PW_CHROMIUM_PATH || undefined });
                  const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
                  const catalogRequests = [];
                  const pageErrors = [];
                  page.on('request', (req) => /catalog\.json/.test(req.url()) && catalogRequests.push(req.url()));
                  page.on('pageerror', (err) => pageErrors.push(err.message));
                  await page.goto(url);
                  await page.locator('#splash').waitFor({ state: 'detached', timeout: SPLASH_TIMEOUT_MS });
                  const versionShown = await page.locator('#root').getByText(version, { exact: true }).isVisible();
                  await browser.close();
                  console.log({ versionShown, catalogRequests, pageErrors });
                  if (!versionShown || catalogRequests.length > 0 || pageErrors.length > 0) {
                      console.log('::error::production smoke failed');
                      process.exit(1);
                  }
                  EOF

            # 同本機一樣：npm run e2e（root 轉發去 apps/player）= build + node e2e/run.mjs（自己起 vite preview，port 4173）
            - run: npm run e2e

            # Admin e2e：build + vite preview + Playwright mock 晒 /api、/auth（唔使 Worker）
            - run: npm run e2e:admin

            - name: Upload e2e screenshots
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: e2e-screenshots
                  path: |
                      apps/player/e2e/screenshots/
                      apps/admin/e2e/screenshots/
                  if-no-files-found: ignore
                  retention-days: 7
