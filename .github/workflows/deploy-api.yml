name: Deploy API

# apps/api（Cloudflare Worker 903-player-api）：main push 而且改咗 Worker、admin SPA 或者佢哋用嘅 catalog package 先跑。
# 先 build admin（Worker static assets = apps/admin/dist；build 失敗就唔郁 D1，唔會留低半套 deploy），
# 再 apply D1 migration（未 apply 嘅先會跑），檢查 admin build 真係有 index.html，再 deploy Worker（S-808）。
# Secrets：CLOUDFLARE_API_TOKEN（Workers Scripts / D1 / Workers R2 Storage：Edit，1 年到期）、CLOUDFLARE_ACCOUNT_ID。
# Worker 自己嘅 secret（GOOGLE_CLIENT_SECRET、SESSION_SECRET）喺 Cloudflare dashboard 設，唔經 CI（見 apps/api/README.md）
# 例外：重新部署 player 嘅兩個選填 secret 由 GitHub secret 同步（DEPLOY_GITHUB_TOKEN → Worker GITHUB_DEPLOY_TOKEN、
# VERCEL_DEPLOY_HOOK_URL）；GitHub secret 名唔准 GITHUB_ 開頭，所以 token 喺 GitHub 叫 DEPLOY_GITHUB_TOKEN。未設 = 跳過
# S-769：Cloudflare secret 只畀 wrangler 兩步（npm ci 嘅 lifecycle script、npm test、admin build 攞唔到）；
# workflow_dispatch 揀非 main ref 第一步就 fail（同 import-catalog.yml 一樣，只防手滑；真邊界係 GitHub Environment，S-781）
on:
    push:
        branches: [main]
        paths:
            - 'apps/api/**'
            - 'apps/admin/**'
            - 'packages/catalog/**'
            - 'package-lock.json'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-api
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        steps:
            # checkout 之前 apps/api 未存在 → 用 workspace 根
            - name: Require main
              if: github.ref != 'refs/heads/main'
              working-directory: .
              env:
                  REF: ${{ github.ref }}
              run: |
                  echo "::error::Deploy API only runs on main (got $REF). Pick 'main' in the 'Use workflow from' menu."
                  exit 1

            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              working-directory: .

            # deploy 之前喺 workerd 再跑一次 api test（同 CI 一樣，唔使 Cloudflare 帳戶）
            - run: npm test

            # wrangler.toml [assets] directory = ../admin/dist；放喺 migration 之前（S-808）
            - name: Build admin SPA
              run: npm run build -w apps/admin
              working-directory: .

            # api test 會開個空 apps/admin/dist（vitest.config.ts），冇 index.html 就會 deploy 一個空 SPA
            - name: Check admin build
              run: test -f ../admin/dist/index.html || { echo "::error::apps/admin/dist/index.html missing"; exit 1; }

            - name: Apply D1 migrations
              run: npx wrangler d1 migrations apply 903-player --remote
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy Worker
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            # 選填（App 外觀）：有設先 `wrangler secret bulk`，兩個都冇就跳過（publish 照成功，deploy: skipped）。
            # 值只經 env → node 寫入 RUNNER_TEMP 嘅 JSON（600）→ wrangler，唔會出現喺 command line / log；用完即刪
            - name: Sync optional deploy secrets
              run: |
                  file="$RUNNER_TEMP/deploy-secrets.json"
                  trap 'rm -f "$file"' EXIT
                  node -e '
                      const pairs = [
                          ["GITHUB_DEPLOY_TOKEN", process.env.DEPLOY_GITHUB_TOKEN],
                          ["VERCEL_DEPLOY_HOOK_URL", process.env.VERCEL_DEPLOY_HOOK_URL],
                      ].filter(([, value]) => value);
                      require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(pairs)), { mode: 0o600 });
                      console.log(`deploy secrets to sync: ${pairs.map(([name]) => name).join(", ") || "none"}`);
                  ' "$file"
                  if [ "$(cat "$file")" = "{}" ]; then exit 0; fi
                  npx wrangler secret bulk "$file"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  DEPLOY_GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
                  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
