name: Deploy API

# apps/api（Cloudflare Worker 903-player-api）：main push 而且改咗 Worker 或者佢用嘅 catalog package 先跑。
# 先 apply D1 migration（未 apply 嘅先會跑），再 deploy Worker。
# Secrets：CLOUDFLARE_API_TOKEN（Workers Scripts / D1 / Workers R2 Storage：Edit，1 年到期）、CLOUDFLARE_ACCOUNT_ID。
# Worker 自己嘅 secret（GOOGLE_CLIENT_SECRET、SESSION_SECRET）喺 Cloudflare dashboard 設，唔經 CI（見 apps/api/README.md）
on:
    push:
        branches: [main]
        paths:
            - 'apps/api/**'
            - 'packages/catalog/**'
            - 'package-lock.json'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-api
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              working-directory: .

            # deploy 之前喺 workerd 再跑一次 api test（同 CI 一樣，唔使 Cloudflare 帳戶）
            - run: npm test

            - name: Apply D1 migrations
              run: npx wrangler d1 migrations apply 903-player --remote

            - name: Deploy Worker
              run: npx wrangler deploy
