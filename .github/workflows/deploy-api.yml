name: Deploy API

# apps/api（Cloudflare Worker 903-player-api）：main push 而且改咗 Worker、admin SPA 或者佢哋用嘅 catalog package 先跑。
# 兩個 job（AU-019）：
# - build（冇 secret）：全 repo lint + type check + unit test（AU-016），再 build admin（Worker static assets = apps/admin/dist），
#   檢查真係有 index.html，上載做 artifact。任何一步失敗 deploy job 就唔跑：唔郁 D1，唔會留低半套 deploy
# - deploy（有 secret）：全新 checkout + `npm ci --ignore-scripts`，下載 artifact 去 apps/admin/dist，
#   apply D1 migration（未 apply 嘅先會跑），再 deploy Worker（S-808）
# Secrets：CLOUDFLARE_API_TOKEN（Workers Scripts / D1 / Workers R2 Storage：Edit，1 年到期）、CLOUDFLARE_ACCOUNT_ID。
# Worker 自己嘅 secret（GOOGLE_CLIENT_SECRET、SESSION_SECRET）喺 Cloudflare dashboard 設，唔經 CI（見 apps/api/README.md）
# 例外：重新部署 player 嘅兩個選填 secret 由 GitHub secret 同步（DEPLOY_GITHUB_TOKEN → Worker GITHUB_DEPLOY_TOKEN、
# VERCEL_DEPLOY_HOOK_URL）；GitHub secret 名唔准 GITHUB_ 開頭，所以 token 喺 GitHub 叫 DEPLOY_GITHUB_TOKEN。未設 = 跳過
# S-769 / AU-019：Cloudflare secret 只畀 deploy job 嘅 wrangler 步驟。npm ci 嘅 lifecycle script、lint、vitest、
# vite build 全部喺 build job 跑：另一部 runner，攞唔到 secret，亦改唔到 deploy job 嘅 node_modules / wrangler.toml；
# deploy job 自己唔跑任何 lifecycle script（--ignore-scripts），由 build job 過嚟嘅只有 admin-dist artifact（靜態檔）。
# workflow_dispatch 揀非 main ref 第一步就 fail（同 import-catalog.yml 一樣，只防手滑；真邊界係 GitHub Environment，S-781）
on:
    push:
        branches: [main]
        paths:
            - 'apps/api/**'
            - 'apps/admin/**'
            - 'packages/catalog/**'
            - 'package-lock.json'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-api
    cancel-in-progress: false

jobs:
    build:
        name: Check & build admin SPA
        runs-on: ubuntu-latest
        steps:
            - name: Require main
              if: github.ref != 'refs/heads/main'
              env:
                  REF: ${{ github.ref }}
              run: |
                  echo "::error::Deploy API only runs on main (got $REF). Pick 'main' in the 'Use workflow from' menu."
                  exit 1

            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # AU-016：deploy 之前喺 repo 根跑同 ci.yml check job 一樣嘅全套檢查（唔使 Cloudflare 帳戶）；
            # 直接 push main 或者 merge 一個 CI 紅 / 被跳過嘅 PR，都要過咗呢度先會郁 D1 同 Worker。
            # 全 repo lint（eslint + prettier --check .）
            - run: npm run lint

            # 全部 workspace（player、admin、catalog、api）嘅 type check
            - run: npx tsc -b

            # 全部 project：player、admin（jsdom）、catalog、api（Worker test 喺 workerd 跑）、repo scripts
            - run: npm test

            # wrangler.toml [assets] directory = ../admin/dist；喺 deploy job 嘅 migration 之前（S-808）
            - name: Build admin SPA
              run: npm run build -w apps/admin

            # api test 會開個空 apps/admin/dist（vitest.config.ts），冇 index.html 就會 deploy 一個空 SPA
            - name: Check admin build
              run: test -f apps/admin/dist/index.html || { echo "::error::apps/admin/dist/index.html missing"; exit 1; }

            # 保留 7 日（同 ci.yml 嘅 player-dist-production 一樣）：過期之後「Re-run failed jobs」嘅 deploy 會喺 download 嗰步 fail，
            # 要用「Re-run all jobs」
            - name: Upload admin build
              uses: actions/upload-artifact@v5
              with:
                  name: admin-dist
                  path: apps/admin/dist
                  if-no-files-found: error
                  retention-days: 7

    deploy:
        needs: build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        steps:
            # build job 已經擋咗（needs: build → 佢 fail 呢個 job 唔會跑）；帶 secret 嘅 job 自己再擋一次。
            # checkout 之前 apps/api 未存在 → 用 workspace 根
            - name: Require main
              if: github.ref != 'refs/heads/main'
              working-directory: .
              env:
                  REF: ${{ github.ref }}
              run: |
                  echo "::error::Deploy API only runs on main (got $REF). Pick 'main' in the 'Use workflow from' menu."
                  exit 1

            - uses: actions/checkout@v7

            # 刻意唔用 `cache: npm`：呢個 job 唔食 build job（行過第三方 code）寫入嘅 npm cache
            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            # AU-019：唔跑任何 package 嘅 lifecycle script（lockfile 入面有 install script 嘅只有 esbuild / workerd / fsevents，
            # wrangler d1 / deploy / secret 唔靠佢哋嘅 postinstall：esbuild 用 @esbuild/<platform> 嘅 binary）
            - run: npm ci --ignore-scripts
              working-directory: .

            # path 係相對 workspace 根（唔受 defaults.run.working-directory 影響）= wrangler.toml [assets] directory = ../admin/dist
            - name: Download admin build
              uses: actions/download-artifact@v5
              with:
                  name: admin-dist
                  path: apps/admin/dist

            # 下載完再檢查一次：冇 index.html 就會 deploy 一個空 SPA；放喺 migration 之前（S-808）
            - name: Check admin build
              run: test -f ../admin/dist/index.html || { echo "::error::apps/admin/dist/index.html missing"; exit 1; }

            - name: Apply D1 migrations
              run: npx wrangler d1 migrations apply 903-player --remote
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy Worker
              run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            # 選填（App 外觀）：有設先 `wrangler secret bulk`，兩個都冇就跳過（publish 照成功，deploy: skipped）。
            # 值只經 env → node 寫入 RUNNER_TEMP 嘅 JSON（600）→ wrangler，唔會出現喺 command line / log；用完即刪
            - name: Sync optional deploy secrets
              run: |
                  file="$RUNNER_TEMP/deploy-secrets.json"
                  trap 'rm -f "$file"' EXIT
                  node -e '
                      const pairs = [
                          ["GITHUB_DEPLOY_TOKEN", process.env.DEPLOY_GITHUB_TOKEN],
                          ["VERCEL_DEPLOY_HOOK_URL", process.env.VERCEL_DEPLOY_HOOK_URL],
                      ].filter(([, value]) => value);
                      require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(pairs)), { mode: 0o600 });
                      console.log(`deploy secrets to sync: ${pairs.map(([name]) => name).join(", ") || "none"}`);
                  ' "$file"
                  if [ "$(cat "$file")" = "{}" ]; then exit 0; fi
                  npx wrangler secret bulk "$file"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  DEPLOY_GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
                  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
