name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
    # apps/api publish 改咗 catalog.branding 就 dispatch 呢個，重 build 套用新 App 圖示 / 名稱
    repository_dispatch:
        types: [catalog-branding]

# AU-019：workflow 層只有 contents: read；可以出 Pages 嘅權限（pages: write + id-token: write）只畀 deploy job，
# build job（npm ci lifecycle script、lint、vitest、vite build）嘅 GITHUB_TOKEN 攞唔到
permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        # job 層 permissions 會取代 workflow 層成份；pages: read 係畀 configure-pages 讀 Pages 設定（只讀，出唔到嘢）
        permissions:
            contents: read
            pages: read
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Lint & test
              run: |
                  npm run lint
                  npm test

            - uses: actions/configure-pages@v6

            # runtime catalog（Backend Phase 2a）：repo variable（唔係 secret）VITE_CATALOG_URL；未設 = 空 = 功能關住
            - run: npm run build
              env:
                  VITE_CATALOG_URL: ${{ vars.VITE_CATALOG_URL }}

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: apps/player/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # 呢個 job 冇 checkout，亦唔跑 repo 入面任何 code：只有 deploy-pages action
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
