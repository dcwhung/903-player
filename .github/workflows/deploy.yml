name: Scrape & Deploy

on:
    push:
        branches: [main]
    schedule:
        # 每 30 分鐘更新錄音列表（GitHub 排程可能延遲 10–60 分鐘）
        - cron: '*/30 * * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Lint & test
              if: github.event_name != 'schedule'
              run: |
                  npm run lint
                  npm test

            - name: Scrape recordings
              run: npm run scrape
              env:
                  FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/recordings.json

            - run: npm run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
