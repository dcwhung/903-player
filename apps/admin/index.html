<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>903 Player Admin</title>
        <!--
            字體同 player 一樣（apps/player/index.html）：Poppins + Noto Sans TC，preload 落嚟先套用，
            未到就用 system font（display=swap）；冇 JS 嘅話 noscript 照用返普通 stylesheet
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
            />
        </noscript>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
