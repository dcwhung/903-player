<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>903 Player Admin</title>
        <!-- icon 同 player 一樣（apps/player/public）；之後由「App 外觀」發佈嘅 icon 取代 -->
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!--
            淺 / 深色：first paint 之前套用 localStorage 嘅選擇（key 同 src/app/themePref.ts THEME_KEY 一致），
            唔會先閃一下系統色；讀唔到就跟系統
        -->
        <script>
            try {
                var theme = localStorage.getItem('admin.theme');
                if (theme === 'light' || theme === 'dark')
                    document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {}
        </script>
        <!--
            字體同 player 一樣（apps/player/index.html）：Poppins + Noto Sans TC（加 Roboto 500 畀 Google 登入掣），preload 落嚟先套用，
            未到就用 system font（display=swap）；冇 JS 嘅話 noscript 照用返普通 stylesheet
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@500&display=swap"
            onload="
                this.onload = null;
                this.rel = 'stylesheet';
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@500&display=swap"
            />
        </noscript>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
